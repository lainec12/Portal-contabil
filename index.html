<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Carregando Portal Contábil…</title><style>body{font:16px/1.5 system-ui,sans-serif;background:#f4f0fb;color:#241b37;display:grid;min-height:100vh;place-items:center;margin:0}main{max-width:34rem;margin:1rem;padding:2rem;border:1px solid #ded2f7;border-radius:1rem;background:white;box-shadow:0 12px 36px #241b3712}progress{width:100%;accent-color:#9274d6}#erro{color:#9a2941}</style><main><h1>Portal Contábil</h1><p id="status" role="status">Carregando o portal completo…</p><progress max="80" value="0"></progress><p id="erro"></p></main><script>(async()=>{const status=document.getElementById('status'),bar=document.querySelector('progress'),base='./payload-site-feb3c671b5/site-';const delay=ms=>new Promise(r=>setTimeout(r,ms));async function get(i){const u=new URL(base+String(i).padStart(3,'0')+'.txt',document.baseURI);let last;for(let attempt=0;attempt<3;attempt++){try{const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);return await r.text()}catch(e){last=e;if(attempt<2)await delay(350*(attempt+1))}}throw Error('Não consegui carregar '+u.pathname+': '+last)}try{const chunks=[];for(let start=0;start<80;start+=5){const group=await Promise.all(Array.from({length:Math.min(5,80-start)},(_,n)=>get(start+n)));chunks.push(...group);bar.value=chunks.length}const page=chunks.join('');if(!page.includes('id="conferencia-notas"')||!page.includes('id="themeToggle"')||!page.includes('id="difal-guia-uf"'))throw Error('O conteúdo carregado está incompleto.');document.open();document.write(page);document.close()}catch(e){status.textContent='Não foi possível carregar o portal completo.';document.getElementById('erro').textContent=e.message+' Atualize a página em alguns instantes.';console.error(e)}})();</script></main></html>
