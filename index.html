<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Carregando Portal Contábil…</title><style>body{font:16px/1.5 system-ui,sans-serif;background:#f4f0fb;color:#241b37;display:grid;min-height:100vh;place-items:center;margin:0}main{max-width:34rem;margin:1rem;padding:2rem;border:1px solid #ded2f7;border-radius:1rem;background:white;box-shadow:0 12px 36px #241b3712}progress{width:100%;accent-color:#9274d6}#erro{color:#9a2941}</style><main><h1>Portal Contábil</h1><p id="status" role="status">Carregando o portal completo…</p><progress></progress><p id="erro"></p></main><script>(async()=>{const status=document.getElementById('status'),bar=document.querySelector('progress');try{const urls=Array.from({length:70},(_,i)=>new URL('./payload-30d735b938/site-'+String(i).padStart(3,'0')+'.txt',document.baseURI));let done=0;const chunks=await Promise.all(urls.map(async u=>{const r=await fetch(u);if(!r.ok)throw Error('Não consegui carregar '+u.pathname);const t=await r.text();done++;bar.value=done/urls.length;return t}));const page=chunks.join('');if(!page.includes('id="conferencia-notas"')||!page.includes('id="themeToggle"'))throw Error('O conteúdo carregado está incompleto.');document.open();document.write(page);document.close()}catch(e){status.textContent='Não foi possível carregar o portal completo.';document.getElementById('erro').textContent=e.message+' Atualize a página em alguns instantes.';console.error(e)}})();</script></main></html>
