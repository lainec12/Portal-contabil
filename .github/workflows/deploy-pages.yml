name: Publicar Fiscora (GitHub Pages)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fiscora-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Restaurar Portal Contabil completo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          rsync -a --exclude='_site/' --exclude='.git/' --exclude='.github/' ./ _site/
          test -f payload-site-9a50c35200/site-000.txt
          cat payload-site-9a50c35200/site-*.txt > _site/index.html
          test -s _site/index.html
          grep -q '</html>' _site/index.html
          grep -q 'Portal Contábil' _site/index.html
          echo "Portal reconstruido: $(wc -c < _site/index.html) bytes"
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Enviar arquivos do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
