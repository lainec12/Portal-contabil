name: Exibir relatório XML em aba recolhível no final
on:
  push:
    paths: ['.github/workflows/diagnosticar-menu.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir posição e formato do relatório
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s,n=re.subn(r'<section id="relatorio-xml-final"\b.*?</section>','',s,flags=re.S)
          print('Seção anterior removida:',n)
          if n!=1:raise RuntimeError('Esperada exatamente uma seção existente; preservando portal')
          section='''<section id="relatorio-xml-final" style="padding:14px max(16px,5vw) 32px;background:#1e2338">
          <div style="max-width:1180px;margin:0 auto">
          <details style="background:#ffffff;border:1px solid #e4e4ee;border-radius:18px;overflow:hidden;color:#172238;box-shadow:0 2px 8px #0001">
          <summary style="cursor:pointer;padding:18px 20px;font-size:16px;font-weight:700;color:#192943;background:#ffffff">Relatório de XMLs e Créditos Fiscais</summary>
          <div style="padding:4px 20px 22px;background:#ffffff;border-top:1px solid #eeeef4">
          <p style="color:#3e4a5e!important;line-height:1.6;margin:12px 0 16px">Importe arquivos ZIP ou XML para conferir entradas, saídas, cancelamentos, CFOPs e valores tributários. Gere relatórios em PDF para o cliente e para o escritório.</p>
          <a href="./relatorio-xml-creditos.html" style="display:inline-block;background:#6333a6;color:#ffffff!important;text-decoration:none;font-weight:700;padding:12px 18px;border-radius:9px">Abrir Relatório de XMLs e Créditos</a>
          </div></details></div></section>'''
          matches=list(re.finditer(r'</main\s*>',s,re.I))
          if not matches:raise RuntimeError('Fechamento main não localizado')
          point=matches[-1].start()
          s=s[:point]+section+'\n'+s[point:]
          assert s.count('id="relatorio-xml-final"')==1
          assert s.count('<summary style="cursor:pointer')>=1
          p.write_text(s,encoding='utf-8')
          print('Relatório inserido em bloco recolhível ao final do main')
          PY
      - name: Confirmar e publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Exibe relatório XML recolhível no final do portal"
            git push
          fi
