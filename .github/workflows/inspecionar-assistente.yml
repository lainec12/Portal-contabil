name: Diagnosticar tema do Fiscora
on:
  push:
    paths: ['.github/workflows/inspecionar-assistente.yml']
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for f in ('index.html','portal.js'):
            s=Path(f).read_text(encoding='utf-8')
            for term in ('contaclara_theme','data-theme','ferramentas-light-style','--surface','themeToggle'):
              matches=list(re.finditer(re.escape(term),s,re.I))
              print('TERM',f,term,len(matches))
              for m in matches[:3]:print('SNIP',repr(s[max(0,m.start()-180):m.start()+350]))
          PY
