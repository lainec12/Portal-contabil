name: Auditoria fiscal automatizada
on:
  push:
    paths:
      - 'fiscal-analysis.mjs'
      - 'tests/**'
      - '.github/workflows/auditoria-fiscal.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxe do módulo
        run: node --check fiscal-analysis.mjs
      - name: Testar motor fiscal
        run: node --test tests/fiscal-analysis.test.mjs
      - name: Testes existentes
        run: node --test tests/*.test.mjs
